version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: llmeval
    main: ./cmd/llmeval
    binary: llmeval
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/farhaan/llmeval/internal/version.Version={{.Version}}

archives:
  - id: llmeval
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - llmeval.example.yaml
      - manifest.example.yaml
      - .claude/commands/llmeval.md

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^chore:"
      - "^docs:"
      - "^test:"
      - "Merge pull request"
      - "Merge branch"
