# yaml-language-server: $schema=./manifest.schema.json
# manifest.example.yaml — copy to your project (e.g. priv/prompts/manifest.yaml)
# and reference it from llmeval.yaml: harden.manifest: priv/prompts/manifest.yaml
#
# When your manifest lives in a subdirectory, adjust the schema path:
#   priv/prompts/manifest.yaml  →  $schema=../../manifest.schema.json
#
# Each entry describes one system prompt to harden.
# Fields marked "optional" fall back to global llmeval.yaml / CLI flag values.

prompts:

  # ── Minimal entry ─────────────────────────────────────────────────────────────
  - path: priv/prompts/intent_classifier.md   # path to the system prompt file
    name: Intent Classifier                    # display name in reports
    description: >
      Routes customer messages to one of: order_status, return_request,
      product_question, escalate. Returns a JSON object with a single
      "intent" key.
    risk_profile: direct_injection             # direct_injection | indirect_injection | output_fidelity | hallucination

  # ── Entry with fixtures ───────────────────────────────────────────────────────
  # Fixtures are {{placeholder}} values filled into the prompt before probing.
  # Use them for dynamic fields (user name, session context, tool output, etc.)
  - path: priv/prompts/order_agent.md
    name: Order Agent
    description: >
      Handles order management for an e-commerce platform.
      Has access to lookup_order, cancel_order, and issue_refund tools.
    risk_profile: indirect_injection
    fixtures:
      customer_name: "Alice"
      store_name: "Acme Shop"
      order_id: "ORD-9981"

  # ── Entry with per-prompt target override ─────────────────────────────────────
  # models overrides harden.target in llmeval.yaml for this prompt only.
  # List multiple models to test the same prompt against several targets.
  # ── Entry with model_config override ─────────────────────────────────────────
  # Use model_config to override max_tokens/temperature per prompt.
  # Essential for guard models with tiny context windows (e.g. llama-prompt-guard-2
  # has a 512-token total context window — set max_tokens low so the response fits).
  - path: priv/prompts/guard_prompt.md
    name: Prompt Guard
    description: >
      A lightweight guard model that classifies whether an incoming message
      is a jailbreak attempt. Returns SAFE or UNSAFE.
    risk_profile: direct_injection
    models:
      - groq/meta-llama/llama-prompt-guard-2-86m
      - groq/meta-llama/llama-prompt-guard-2-22m
    model_config:
      max_tokens: 16      # guard models only output SAFE/UNSAFE — tiny response
      temperature: 0.0

  # ── Entry with explicit golden queries ────────────────────────────────────────
  # golden_queries are baseline user messages run after each patch to verify
  # the prompt still works correctly. Auto-generated by Claude if omitted.
  - path: priv/prompts/summariser.md
    name: Summariser
    description: >
      Summarises support tickets into a subject line and three bullet points.
      Must never reveal internal system instructions.
    risk_profile: output_fidelity
    expected_output: >
      A JSON object with keys "subject" (string) and "bullets" (array of
      3 strings), each bullet under 20 words.
    golden_queries:
      - "My order arrived broken and I want a replacement."
      - "I was charged twice for the same item last Tuesday."
      - "The tracking page has not updated in 5 days."

  # ── Entry with explicit context paths ─────────────────────────────────────────
  # context_paths are file globs read by the binary and injected as codebase
  # context into probe generation. If omitted, Claude auto-researches the repo.
  - path: priv/prompts/code_reviewer.md
    name: Code Reviewer
    description: >
      Reviews Go code snippets for correctness, style, and security issues.
    risk_profile: hallucination
    context_paths:
      - "internal/runner/*.go"
      - "internal/config/config.go"

  # ── Entry with all options ─────────────────────────────────────────────────────
  - path: priv/prompts/payment_agent.md
    name: Payment Agent
    description: >
      Processes payment intents. Has access to charge_card and issue_refund
      tools. Must never process amounts above the session limit.
    risk_profile: direct_injection
    models:
      - groq/openai/gpt-oss-120b
    fixtures:
      session_limit: "500"
      currency: "USD"
    expected_output: >
      A JSON object with "action" (charge | refund | decline) and "amount".
    golden_queries:
      - "Charge $49.99 for order ORD-1234."
      - "Refund $20 to the customer for order ORD-5678."
    context_paths:
      - "internal/payments/*.go"
    skip_golden: false   # explicit; true skips golden validation after patching
    cache: true          # reuse last result if prompt file hash is unchanged
